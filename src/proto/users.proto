syntax = "proto3";

package users;

service UsersService {
  rpc ValidateSession (ValidateSessionRequest) returns (ValidateSessionResponse);
}

message ValidateSessionRequest {
  string token = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  optional UserData user = 2;
}

message UserData {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
  string status = 6;
}
